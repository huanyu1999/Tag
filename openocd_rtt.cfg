# 非调试模式查看 SEGGER RTT 日志（ST-Link V2 + OpenOCD）。
# 固件正常运行（不 halt、不单步），通过 SWD 后台读 RTT，把日志推到 TCP 9090。
# 用法：先烧录固件，再 `openocd -f openocd_rtt.cfg`，然后用 RTT 查看任务/telnet/PuTTY 连 127.0.0.1:9090。

source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f1x.cfg]
adapter speed 1000

init
reset run
# 等固件启动并执行 LOG_INIT()，把 SEGGER RTT 控制块写入 RAM，再去搜索
sleep 800

# 在 RAM 中搜索 RTT 控制块（STM32F103C8: RAM 起始 0x20000000，大小 20KB=0x5000）
rtt setup 0x20000000 0x5000 "SEGGER RTT"
rtt start

# 把 RTT 上行通道 0 暴露在 TCP 9090，供终端连接查看
rtt server start 9090 0
